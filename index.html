<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel App Upgrade</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body { font-family: Arial; background:#eef6fb; }
.card { background:white; padding:12px; margin:8px 0; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.tab { display:flex; gap:10px; justify-content:center; padding:10px; position:fixed; bottom:10px; width:100%; }
.tab button { padding:10px; border-radius:999px; background:#fff; }
.active { background:#2563eb; color:white; }
</style>
</head>

<body>
<div id="app">

<!-- TAB -->
<div class="tab">
  <button @click="tab='plan'" :class="{active:tab==='plan'}">📍行程</button>
  <button @click="tab='info'" :class="{active:tab==='info'}">ℹ️資訊</button>
  <button @click="tab='shop'" :class="{active:tab==='shop'}">🛒購物</button>
  <button @click="tab='cost'" :class="{active:tab==='cost'}">💰花費</button>
</div>

<!-- PLAN -->
<div v-if="tab==='plan'" style="padding:10px">

<h2>📅 Day {{selectedDay+1}}</h2>

<div v-for="(item,index) in itinerary" 
     :key="item.id"
     class="card"
     draggable="true"
     @dragstart="dragIndex=index"
     @drop="drop(index)"
     @dragover.prevent>

  <b>{{item.name}}</b><br>
  <small>{{item.type}}</small><br>
  📍 {{item.location}}

  <div style="margin-top:6px">
    <button @click="openMap(item.location)">🧭 Map</button>
    <button @click="removeItem(index)">🗑</button>
  </div>
</div>

<button @click="addItem">＋新增行程</button>

</div>

<!-- INFO -->
<div v-if="tab==='info'" style="padding:10px">
<h3>✈️ 航班資訊</h3>
<div class="card">
  HKG → CTS <br>
  CX580 09:15 - 14:50
</div>
</div>

<!-- SHOP -->
<div v-if="tab==='shop'" style="padding:10px">
<h3>🛒 購物清單</h3>
<div v-for="(s,i) in shop" class="card">
  {{s}}
</div>
<input v-model="newShop">
<button @click="addShop">＋</button>
</div>

<!-- COST -->
<div v-if="tab==='cost'" style="padding:10px">
<h3>💰 花費</h3>
<div class="card">
Total: ¥{{total}}
</div>
</div>

</div>

<script>
const {createApp} = Vue;

createApp({
data(){
return {
tab:'plan',
selectedDay:0,

itinerary: JSON.parse(localStorage.getItem('itinerary') || '[
{"id":1,"name":"酒店入住","type":"住宿","location":"Sapporo Station"},
{"id":2,"name":"白色戀人公園","type":"景點","location":"Shiroi Koibito Park"}
]'),

shop:[],
newShop:'',
dragIndex:null
}
},

computed:{
total(){
return 12000;
}
},

methods:{

save(){
localStorage.setItem('itinerary', JSON.stringify(this.itinerary));
},

addItem(){
this.itinerary.push({
id:Date.now(),
name:'新行程',
type:'景點',
location:'Tokyo'
});
this.save();
},

removeItem(i){
this.itinerary.splice(i,1);
this.save();
},

drop(i){
const dragged = this.itinerary[this.dragIndex];
this.itinerary.splice(this.dragIndex,1);
this.itinerary.splice(i,0,dragged);
this.save();
},

openMap(loc){
window.open('https://www.google.com/maps?q='+loc);
},

addShop(){
if(this.newShop){
this.shop.push(this.newShop);
this.newShop='';
}
}
}
}).mount('#app');
</script>

</body>
</html>
